<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - GreenDiagnose</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="home-container">
        <h2 style="color: #3b5a40; text-align: left;">Show us the leaf</h2>

        <form id="uploadForm" action="/analyze" method="POST" enctype="multipart/form-data">

            <label style="text-align: left; display: block; color: #5a7a5f; margin-bottom: 0.5rem; font-weight: bold;">Plant species</label>
            <select name="species_id" style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; background-color: white;">
                {% for s in species %}
                <option value="{{ s['id'] }}">{{ s['common_name'] }} ({{ s['scientific_name'] }})</option>
                {% endfor %}
            </select>

            <!-- Upload box -->
            <div style="border: 2px dashed #a3b899; padding: 30px 20px; border-radius: 12px; margin-bottom: 30px; background-color: white;">
                <p style="margin-top: 0; color: #7f9976; margin-bottom: 20px;">Select an image source</p>

                <!-- The file input is hidden; the buttons below open it -->
                <input type="file" id="imageInput" name="file" accept="image/*" required style="display: none;">

                <div style="display: flex; gap: 10px;">
                    <button type="button" id="btnCamera" style="flex: 1; padding: 12px; background-color: #f4f6f0; border: 2px solid #3b5f41; color: #3b5f41; border-radius: 8px; font-weight: bold; cursor: pointer;">Take Photo</button>
                    <button type="button" id="btnGallery" style="flex: 1; padding: 12px; background-color: #f4f6f0; border: 2px solid #3b5f41; color: #3b5f41; border-radius: 8px; font-weight: bold; cursor: pointer;">Choose File</button>
                </div>

                <!-- Preview of the selected photo -->
                <div id="imagePreview" style="display: none; margin-top: 15px; text-align: center;">
                    <img id="previewImg" alt="Selected leaf preview"
                         style="max-width: 100%; max-height: 260px; border-radius: 8px; border: 1px solid #a8b8a0;">
                    <p id="fileNameDisplay" style="margin: 8px 0 0; font-size: 0.9rem; color: #3b5a40; font-weight: bold;"></p>
                </div>

                <!-- Shown only when the user tries to continue without a photo -->
                <p id="noFileMessage" style="display: none; margin: 15px 0 0; color: #b03a2e; font-weight: bold;">
                    Please take or choose a leaf photo before continuing.
                </p>
            </div>

            <button type="submit" class="btn">Continue</button>

            <label>
                <input type="checkbox" name="consent_for_training" value="1">
                I consent to allow my anonymized image to be used for future AI model training.
            </label>
        </form>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const btnCamera = document.getElementById('btnCamera');
        const btnGallery = document.getElementById('btnGallery');
        const uploadForm = document.getElementById('uploadForm');
        const imagePreview = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const noFileMessage = document.getElementById('noFileMessage');

        let currentUrl = null;

        // Take Photo: use the camera
        btnCamera.addEventListener('click', () => {
            imageInput.setAttribute('capture', 'environment');
            imageInput.click();
        });

        // Choose File: use the gallery
        btnGallery.addEventListener('click', () => {
            imageInput.removeAttribute('capture');
            imageInput.click();
        });

        // Show the chosen photo
        imageInput.addEventListener('change', () => {
            const file = imageInput.files[0];

            if (currentUrl) {
                URL.revokeObjectURL(currentUrl);
                currentUrl = null;
            }

            if (!file) {
                imagePreview.style.display = 'none';
                previewImg.removeAttribute('src');
                fileNameDisplay.textContent = '';
                return;
            }

            noFileMessage.style.display = 'none';

            if (!file.type.startsWith('image/')) {
                imagePreview.style.display = 'block';
                previewImg.removeAttribute('src');
                previewImg.style.display = 'none';
                fileNameDisplay.textContent = 'Not an image: ' + file.name;
                return;
            }

            currentUrl = URL.createObjectURL(file);
            previewImg.src = currentUrl;
            previewImg.style.display = 'inline-block';
            imagePreview.style.display = 'block';
            fileNameDisplay.textContent = file.name;
        });

        // Show a visible message if Continue is pressed without a photo
        uploadForm.addEventListener('submit', (event) => {
            if (!imageInput.files || imageInput.files.length === 0) {
                event.preventDefault();
                noFileMessage.style.display = 'block';
            }
        });
    </script>
</body>
</html>
